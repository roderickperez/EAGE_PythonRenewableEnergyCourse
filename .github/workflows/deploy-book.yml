name: deploy-book

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate student course
        run: python tools/validate_course.py

      - name: Build the book
        run: |
          cd EAGE_PythonRenewableEnergyCourse
          jupyter book build --html

      - name: Verify instructor answers are excluded
        run: python tools/check_student_build.py

      - name: Build and validate the participant sandbox
        run: |
          python tools/build_sandbox.py --deploy
          python tools/validate_sandbox.py
          python tools/check_student_build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "EAGE_PythonRenewableEnergyCourse/_build/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
