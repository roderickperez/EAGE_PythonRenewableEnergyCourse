<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">Two closed-loop geothermal configurations</title><desc id="desc">A U-loop has separated vertical legs joined at depth. A coaxial system has concentric downflow and return paths within a single borehole.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="470" rx="16" fill="#f5f9fb"/><g font-family="Arial,sans-serif" fill="#16384c"><text x="42" y="40" font-size="25" font-weight="bold">U-shaped loop</text><text x="600" y="40" font-size="25" font-weight="bold">Coaxial loop</text><text x="42" y="72" font-size="16">Two vertical legs joined by a lateral</text><text x="600" y="72" font-size="16">Two concentric flow paths in one borehole</text></g>
<path d="M35 125H525 M585 125H1075" stroke="#657e62" stroke-width="8"/><path d="M35 130H525V440H35Z M585 130H1075V440H585Z" fill="#dbc1a7" opacity=".6"/>
<path d="M145 103 V330 Q145 374 190 374 H375 Q420 374 420 330 V103" fill="none" stroke="#f3f6f6" stroke-width="31" stroke-linejoin="round"/><path d="M145 103 V330 Q145 374 190 374 H275" fill="none" stroke="#258ac0" stroke-width="14"/><path d="M275 374 H375 Q420 374 420 330 V103" fill="none" stroke="#cc4c36" stroke-width="14"/><path d="M145 170V230 M230 374H280" fill="none" stroke="#fff" stroke-width="3" marker-end="url(#a)"/><path d="M420 270V210" fill="none" stroke="#fff" stroke-width="3" marker-end="url(#a)"/>
<path d="M760 102 V328 Q760 375 803 375 H962" fill="none" stroke="#8e9c9e" stroke-width="45" stroke-linecap="round"/><path d="M760 102 V328 Q760 375 803 375 H962" fill="none" stroke="#258ac0" stroke-width="33" stroke-linecap="round"/><path d="M760 102 V328 Q760 375 803 375 H962" fill="none" stroke="#f5f9fb" stroke-width="18" stroke-linecap="round"/><path d="M760 102 V328 Q760 375 803 375 H962" fill="none" stroke="#cc4c36" stroke-width="10" stroke-linecap="round"/><path d="M750 180V240" stroke="#fff" stroke-width="3" marker-end="url(#a)"/><path d="M760 275V215" stroke="#fff" stroke-width="3" marker-end="url(#a)"/>
