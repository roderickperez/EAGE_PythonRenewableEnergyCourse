<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geothermal equation explorer</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; color: #163b38; font: 15px/1.4 system-ui, sans-serif }
  main { padding: 14px; border: 1px solid #c7dbd4; border-radius: 12px; background: #fff }
  h1 { margin: 0 0 10px; font: 600 clamp(20px, 4vw, 26px)/1.15 Georgia, serif }
  .explorer-grid { display: grid; grid-template-columns: minmax(0,1.65fr) minmax(235px,1fr); gap: 14px; align-items: stretch }
  .equation-visuals { display: grid; gap: 9px; min-width: 0; }
  .equation-visuals:has(.plot-panel:not([hidden])) { grid-template-columns: minmax(0,1.65fr) minmax(0,1fr); }
  figure { display: flex; flex-direction: column; margin: 0; position: relative; border-radius: 8px; border: 1px solid #d4e4e7; background: #f1f8f8 }
  [hidden] { display: none !important; }
  #model { position: relative; flex: 1; min-height: clamp(188px, 22vw, 300px); overflow: hidden; border-radius: 7px 7px 0 0; }
  #model canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #model-key { padding: 8px 10px; border-top: 1px solid #d4e4e7; background: #fcfefe; }
  #model-key ul { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0; margin: 0; }
  #model-key li { display: flex; align-items: flex-start; gap: 5px; }
  #model-key i { width: 8px; height: 8px; margin: .35em 0; border-radius: 50%; flex: none; }
  #model-key p { margin: 4px 0 0; }
  .has-scene { grid-template-columns: minmax(0, 2.45fr) minmax(220px, 1fr); }
  #equation-plot { display: block; flex: 1; width: 100%; min-height: 180px; }
  figure figcaption { padding: 5px 8px 8px; font-size: .75rem; color: #506b67; }
  #drawing { display: block; flex: 1; width: 100%; min-height: 160px }
  #motion { position: absolute; inset: 8px auto auto 8px; color: #163b38; background: #fff; border: 1px solid #adc7c1; border-radius: 6px; padding: 0; cursor: pointer }
  #motion[hidden] { display: none }
  .equation-inputs { padding: 12px; border: 1px solid #d4e5e1; border-radius: 8px; background: #f7fbfa; }
  #result { display: block; margin-bottom: 8px; padding: 8px 10px; border-radius: 6px; background: #e2f1ed; color: #176278; font-weight: 750; font-variant-numeric: tabular-nums }
  #equations p { margin: 0 0 10px; color: #36545b; font-size: .82rem; overflow-wrap: anywhere; font-variant-numeric: tabular-nums }
  #controls { display: grid; gap: 7px }
  label { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1px 6px; font-size: .82rem; font-weight: 650 }
  label output { font-weight: 500; white-space: nowrap }
  input { width: 100%; margin: 3px 0; accent-color: #177c90 }
  #note { margin: 9px 0 0; color: #506b67; font-size: .8rem }
  @media (max-width: 950px) {
    .has-scene { grid-template-columns: minmax(0,1fr); }
    .has-scene #model { min-height: 245px; }
  }
  @media (max-width: 620px) {
    .equation-visuals:has(.plot-panel:not([hidden])) { grid-template-columns: minmax(0,1fr); }
  }
  @media (max-width: 635px) { .explorer-grid { grid-template-columns: minmax(0,1fr) } }
</style>
<main>
  <h1 id="title"></h1>
  <div class="explorer-grid">
    <div class="equation-visuals">
      <figure>
        <div id="model" role="img" hidden></div>
        <svg id="drawing" viewBox="0 0 560 272" role="img" font-family="system-ui, sans-serif"></svg>
        <button type="button" id="motion"></button>
        <figcaption id="model-key" hidden></figcaption>
      </figure>
      <figure class="plot-panel" hidden>
        <svg id="equation-plot" viewBox="0 0 285 246" role="img" font-family="system-ui, sans-serif"></svg>
        <figcaption id="plot-note" hidden></figcaption>
      </figure>
    </div>
    <section class="equation-inputs" aria-label="Inputs and results">
      <output id="result"></output>
      <div id="equations"></div>
      <div id="controls" role="group" aria-label="Equation inputs"></div>
    </section>
  </div>
  <p id="note"></p>
</main>
<script type="module" src="equations.js?v=geothermal-equations-5"></script>
</html>
