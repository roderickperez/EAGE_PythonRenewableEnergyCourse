<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydraulic equation explorer</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; color: #163b38; background: #f6faf8; font: 15px/1.4 system-ui, sans-serif }
  main { padding: 14px; border: 1px solid #c7dbd4; border-radius: 12px; background: #fff }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 3px 16px; margin-bottom: 10px }
  h1 { margin: 0; font: 600 clamp(20px,4vw,26px)/1.15 Georgia,serif }
  #result { font-size: clamp(22px,5vw,32px); font-weight: 750; color: #176d86 }
  #scene { position: relative; height: 204px; overflow: hidden; border-radius: 8px; background: #e9f3f4 }
  #scene canvas { display: block }
  #motion { position: absolute; z-index: 1; top: 8px; left: 8px; padding: 5px 8px; color: #163b38; background: #fff; border: 1px solid #adc7c1; border-radius: 6px; font: inherit; font-size: .78rem; cursor: pointer }
  #scene:has(#fallback:not([hidden])) { height: auto }
  #fallback { margin: 0; padding: 12px }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 7px 0 10px; font-size: .79rem; color: #31524f }
  .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 2px; background: var(--swatch) }
  #equations { display: grid; gap: 4px; margin: 0 0 11px }
  #equations > div { padding: 5px 8px; background: #eef6f2; border-left: 3px solid #3e796f; overflow-wrap: anywhere; font-variant-numeric: tabular-nums }
  #controls { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(165px,100%),1fr)); gap: 8px 12px }
  .control label { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1px 6px; font-size: .82rem; font-weight: 650 }
  .control output { font-weight: 500; white-space: nowrap }
  input { width: 100%; margin: 3px 0; accent-color: #177c90 }
  #note { margin: 7px 0 0; color: #506b67; font-size: .8rem }
  @media (max-width:430px) { main { padding: 10px } #scene { height: 156px } #controls { grid-template-columns: repeat(2,minmax(0,1fr)) } }
</style>
<main>
  <header><h1 id="title"></h1><output id="result"></output></header>
  <div id="scene"><div id="drawing" role="img"></div><button id="motion" type="button" hidden></button><p id="fallback" hidden>The 3D diagram is unavailable. The values still update with the sliders.</p></div>
  <div id="legend" class="legend"></div>
  <div id="equations"></div>
  <div id="controls" role="group" aria-label="Equation inputs"></div>
  <p id="note"></p>
</main>
<script type="module" src="balance.js?v=autoplay-3"></script>
</html>
