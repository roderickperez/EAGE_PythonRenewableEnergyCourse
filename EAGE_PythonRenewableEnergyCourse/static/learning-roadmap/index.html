<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learning RoadMap · Island expedition</title><link rel="icon" href="./python.svg">
<link rel="stylesheet" href="styles.css?v=expedition"><script defer src="../../course-session-refresh.js"></script>

<body><main><div id="world"></div>
<header><div><a href="../../index.html">← Course sandbox</a><h1>Learning RoadMap</h1></div><button id="routes">Destinations</button></header>
