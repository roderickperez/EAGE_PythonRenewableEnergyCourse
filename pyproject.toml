[project]
name = "eage-python-course"
version = "0.1.0"
description = "Python for Renewable Energy Data Processing – EAGE course"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Book builder
    "jupyter-book>=2.1.2",
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Interactive visualisation
    "plotly>=5.24",
    # Geospatial
    "geopandas>=1.0",
    "folium>=0.17",
    "ipyleaflet>=0.19",
    # Gridded / netCDF data
    "xarray>=2024.0.0",
    "netCDF4>=1.7",
    "openpyxl>=3.1",
    # ML / statistics
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    # Time-series forecasting
    "prophet>=1.1",
    "pmdarima>=2.0",
    "neuralprophet>=0.9",
]
