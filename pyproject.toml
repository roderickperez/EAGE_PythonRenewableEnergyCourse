[project]
name = "eage-python-course"
version = "0.1.0"
description = "Python for Renewable Energy Data Processing — EAGE course"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyter-book>=2.1.2,<3",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "openpyxl>=3.1,<4",
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
geospatial = [
    "plotly>=5.24", "geopandas>=1.0", "folium>=0.17", "cartopy>=0.23",
    "ipyleaflet>=0.19", "geemap>=0.35", "xarray>=2024.0", "netCDF4>=1.7",
]
deep-learning = ["tensorflow>=2.17", "torch>=2.4", "keras>=3.4"]
