    <linearGradient id="woodland" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#174b38"/><stop offset=".55" stop-color="#368059"/><stop offset="1" stop-color="#80a877"/></linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#faf8ef"/><stop offset=".55" stop-color="#dcded8"/><stop offset="1" stop-color="#999f9c"/></linearGradient>
    <linearGradient id="concrete-side" x2="1" y2="1"><stop stop-color="#b9c0bd"/><stop offset="1" stop-color="#717e7e"/></linearGradient>
    <linearGradient id="section-fill" x2="0" y2="1"><stop stop-color="#f2efe5"/><stop offset="1" stop-color="#c3c7bf"/></linearGradient>
    <linearGradient id="lake" x2="0" y2="1"><stop stop-color="#65bad6"/><stop offset=".67" stop-color="#278aaf"/><stop offset="1" stop-color="#155775"/></linearGradient>
    <linearGradient id="surface" x2="0" y2="1"><stop stop-color="#ddf6fa"/><stop offset="1" stop-color="#6fc4db"/></linearGradient>
    <linearGradient id="pipe-water" x2="0" y2="1"><stop stop-color="#bbedf4"/><stop offset=".5" stop-color="#5bbad4"/><stop offset="1" stop-color="#287b9b"/></linearGradient>
    <linearGradient id="steel" x2="1" y2="0"><stop stop-color="#53646a"/><stop offset=".4" stop-color="#d9e1de"/><stop offset=".65" stop-color="#99a7a6"/><stop offset="1" stop-color="#55666b"/></linearGradient>
    <linearGradient id="copper" x2="1" y2="1"><stop stop-color="#f4c080"/><stop offset=".5" stop-color="#b96b3e"/><stop offset="1" stop-color="#754434"/></linearGradient>
    <linearGradient id="runner-case" x2="0" y2="1"><stop stop-color="#79ab89"/><stop offset="1" stop-color="#245e50"/></linearGradient>
    <pattern id="aggregate" width="21" height="14" patternUnits="userSpaceOnUse"><path d="M2 4h2m10 7h3M7 13h1" stroke="#566d64" opacity=".18"/></pattern>
    <clipPath id="upstream-bank"><path d="M0 46H295L222 307 0 427Z"/></clipPath>
