<svg class="plant-cutaway" viewBox="0 0 1000 610" role="img" aria-label="Hydroelectric dam cutaway. Water enters from the reservoir on the left, passes through the penstock and turbine, and returns to the river through the draft tube on the right. The turbine drives a generator above it, which sends electricity through a transformer to the transmission towers. A separate spillway bypasses the turbine.">
